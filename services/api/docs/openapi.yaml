          format: int64
        nickname:
          type: string
        role:
          type: string
          enum: [member, admin, owner]
        mutedUntil:
          type: string
          format: date-time
          nullable: true
    JoinRequest:
      type: object
      required: [id, applicantUserId, applicantName, createdAt]
      properties:
