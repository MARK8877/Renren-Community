openapi: 3.0.3
info:
  title: CreatorHub API
  version: 1.0.0
  description: |
    CreatorHub 社区创作者平台 API。除健康检查、注册和登录接口外，接口均需要
    Authorization: Bearer <token> 请求头。
servers:
  - url: /
    description: 当前 API 服务
tags:
  - name: Health
  - name: Auth
  - name: Videos
  - name: Home
  - name: ShortDramas
  - name: Conversations
  - name: Groups
  - name: Messages
  - name: Friends
  - name: Scraper
paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      operationId: health
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'

  /api/v1/videos:
    get:
      tags: [Videos]
      summary: 分页读取视频
      operationId: listVideos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 视频列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/home/posts:
    get:
      tags: [Home]
      summary: 分页读取外部导入的首页动态
      operationId: listHomePosts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 首页动态列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePostListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/short-dramas:
    get:
      tags: [ShortDramas]
      summary: 分页读取短剧
      operationId: listShortDramas
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 短剧列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortDramaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/short-dramas/{id}/episodes/{index}/play-url:
    get:
      tags: [ShortDramas]
      summary: 刷新指定剧集播放地址
      operationId: getShortDramaEpisodePlayURL
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 临时播放地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayURLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 上游播放地址刷新失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBase'

  /api/v1/admin/scraper/run:
    post:
      tags: [Scraper]
      summary: 手动启动 Pexels 视频采集
      operationId: runVideoScraper
      security:
        - bearerAuth: []
      responses:
        '202':
          description: 采集任务已异步启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScraperRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/scraper/status:
    get:
      tags: [Scraper]
      summary: 查询视频采集任务状态
      operationId: videoScraperStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前调度状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScraperStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册账号
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功并返回登录凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 管理员登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 获取当前用户
      operationId: currentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Auth]
      summary: 更新当前用户资料
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 个人资料已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: 获取会话列表
      operationId: listConversations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations/read-all:
    post:
      tags: [Conversations]
      summary: 将全部会话标记为已读
      operationId: markAllConversationsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations/groups:
    post:
      tags: [Groups]
      summary: 创建群聊
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: 群聊创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations/{key}/group:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
    get:
      tags: [Groups]
      summary: 获取群资料
      operationId: getGroup
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 群资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Groups]
      summary: 更新群资料
      operationId: updateGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: 群资料已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations/{key}/members:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
    get:
      tags: [Groups]
      summary: 获取群成员
      operationId: groupMembers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 群成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{key}/members/invite:
    post:
      tags: [Groups]
      summary: 邀请群成员
      operationId: inviteGroupMemberLegacyPath
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/members/{userID}/role:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [Groups]
      summary: 设置群成员角色
      operationId: setGroupMemberRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, admin, owner]
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/members/{userID}/mute:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [Groups]
      summary: 设置或取消群成员禁言
      operationId: setGroupMemberMute
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteMemberRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
      - $ref: '#/components/parameters/UserID'
    delete:
      tags: [Groups]
      summary: 移除群成员
      operationId: removeGroupMember
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/leave:
    delete:
      tags: [Groups]
      summary: 退出群聊
      operationId: leaveGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/conversations/{key}/owner:
    patch:
      tags: [Groups]
      summary: 转让群主
      operationId: transferGroupOwner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/conversations/{key}/join-requests:
    get:
      tags: [Groups]
      summary: 获取入群申请
      operationId: listJoinRequests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
      responses:
        '200':
          description: 入群申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/join-requests/{id}/resolve:
    post:
      tags: [Groups]
      summary: 处理入群申请
      operationId: resolveJoinRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{key}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationKey'
    get:
      tags: [Messages]
      summary: 获取会话消息
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BeforeMessageID'
      responses:
        '200':
          description: 消息列表，最多返回 50 条
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Messages]
      summary: 发送消息
      operationId: createMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: 消息发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/conversations/{key}/read:
    post:
      tags: [Messages]
      summary: 标记会话已读
      operationId: markConversationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/users/search:
    get:
      tags: [Friends]
      summary: 搜索用户
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: 昵称、邮箱或手机号关键词，至少 2 个字符
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendUserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/friends:
    get:
      tags: [Friends]
      summary: 获取联系人列表
      operationId: listFriends
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 好友列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/friend-requests:
    get:
      tags: [Friends]
      summary: 获取收到的好友申请
      operationId: listFriendRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 好友申请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Friends]
      summary: 发送好友申请
      operationId: sendFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIDRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/friend-requests/{id}/accept:
    post:
      tags: [Friends]
      summary: 接受好友申请
      operationId: acceptFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/friend-requests/{id}/reject:
    post:
      tags: [Friends]
      summary: 拒绝好友申请
      operationId: rejectFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConversationKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: 会话或群聊标识
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Platform:
      name: platform
      in: query
      required: false
      schema:
        type: string
      description: 按视频来源平台筛选
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BeforeMessageID:
      name: beforeId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: 只返回此消息 ID 之前的历史消息
  responses:
    Ok:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    Created:
      description: 创建成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    Unauthorized:
      description: 未登录或登录凭证无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    Conflict:
      description: 状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
    ServerError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBase'
  schemas:
    ResponseBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: 业务数据；无数据的操作通常省略此字段
    ScraperJob:
      type: object
      required: [id, status, triggerType, startedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, succeeded, failed]
        triggerType:
          type: string
          enum: [scheduled, manual]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScraperRunData:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: integer
          format: int64
    ScraperRunResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/ScraperRunData'
    ScraperStatusData:
      type: object
      required: [running]
      properties:
        running:
          type: boolean
        latest:
          allOf:
            - $ref: '#/components/schemas/ScraperJob'
          nullable: true
        nextRunAt:
          type: string
          format: date-time
          nullable: true
    ScraperStatusResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/ScraperStatusData'
    User:
      type: object
      required: [id, nickname, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        phone:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
          maxLength: 60
        role:
          type: string
          enum: [user, admin]
    AuthData:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    UpdateProfileRequest:
      type: object
      required: [nickname, bio]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        bio:
          type: string
          maxLength: 60
    Video:
      type: object
      required: [platform, externalId, title, playUrl, likeCount, commentCount, shareCount, scrapedAt]
      properties:
        id:
          type: integer
          format: int64
        platform:
          type: string
        externalId:
          type: string
        title:
          type: string
        playUrl:
          type: string
          format: uri
        likeCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
        shareCount:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scrapedAt:
          type: string
          format: date-time
    HomePost:
      type: object
      required: [id, source, externalId, author, role, content, tags, url, scrapedAt]
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
          example: productschool
        externalId:
          type: string
        author:
          type: string
        role:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scrapedAt:
          type: string
          format: date-time
    Conversation:
      type: object
      required: [id, type, name, lastMessage, lastMessageId, unreadCount, updatedAt, pinned, muted]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [private, group]
        name:
          type: string
        memberCount:
          type: string
        lastMessage:
          type: string
        lastMessageType:
          type: string
        lastSender:
          type: string
        lastMessageId:
          type: integer
          format: int64
        unreadCount:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        pinned:
          type: boolean
        muted:
          type: boolean
    CreatedGroup:
      type: object
      required: [id, name, memberCount, memberInviteEnabled]
      properties:
        id:
          type: string
        name:
          type: string
        memberCount:
          type: string
        avatarAssetKey:
          type: string
        announcement:
          type: string
        joinMode:
          type: string
          enum: [direct, approval]
        memberInviteEnabled:
          type: boolean
    Group:
      type: object
