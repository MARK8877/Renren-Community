          format: int64
        applicantUserId:
          type: integer
          format: int64
        applicantName:
          type: string
        inviterUserId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversationId, senderId, senderName, type, content, createdAt, recalled]
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        replyToMessageId:
          type: integer
          format: int64
        senderName:
          type: string
        type:
