      properties:
        id:
          type: string
        name:
          type: string
        ownerUserId:
          type: integer
          format: int64
        avatarAssetKey:
          type: string
        announcement:
          type: string
        joinMode:
          type: string
          enum: [direct, approval]
        memberInviteEnabled:
          type: boolean
        role:
          type: string
          enum: [member, admin, owner]
    GroupMember:
      type: object
      required: [userId, nickname, role]
      properties:
        userId:
